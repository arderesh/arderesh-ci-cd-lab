name: Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint HTML
        run: npx --yes htmlhint@1.1.4 index.html
      - name: Build container
        run: docker build -t ci-site:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name smoke-site -p 8080:80 ci-site:${{ github.sha }}

          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 1 \
            --connect-timeout 2 --max-time 5 \
            http://localhost:8080/ -o /tmp/page.html

          grep -F 'GitHub: arderesh' /tmp/page.html
          echo "OK"

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs smoke-site || true
          docker rm -f smoke-site || true
  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/arderesh/arderesh-ci-cd-lab:latest
            ghcr.io/arderesh/arderesh-ci-cd-lab:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/arderesh/arderesh-ci-cd-lab